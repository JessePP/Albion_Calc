<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Albion Online – Resource Prices EU</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Pro:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:    #0d0d0f;
      --bg2:   #13131a;
      --bg3:   #1a1a24;
      --bdr:   rgba(180,150,80,0.15);
      --bdr2:  rgba(180,150,80,0.30);
      --gold:  #c9a44a;
      --gold2: #8a6e2e;
      --text:  #ddd4c0;
      --dim:   #6a6050;
      --mid:   #a89878;
      --r:     6px;
      --e1: #74c474;
      --e2: #6699dd;
      --e3: #aa77dd;
    }
    body { background:var(--bg); color:var(--text); font-family:'Crimson Pro',Georgia,serif; font-size:15px; min-height:100vh; }
    #app { max-width:1200px; margin:0 auto; padding:1.5rem 1rem 4rem; }

    header { text-align:center; margin-bottom:1.75rem; }
    .logo { font-family:'Cinzel',serif; font-size:clamp(20px,3.5vw,34px); font-weight:600; color:var(--gold); letter-spacing:0.04em; }
    .logo span { display:block; font-size:0.42em; font-weight:400; letter-spacing:0.2em; color:var(--mid); margin-top:3px; }
    .sep { width:180px; height:1px; background:linear-gradient(90deg,transparent,var(--gold2),transparent); margin:12px auto; }

    .res-tabs { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-bottom:1rem; }
    .res-btn {
      font-family:'Cinzel',serif; font-size:12px; letter-spacing:0.05em;
      padding:7px 18px; cursor:pointer; background:transparent;
      border:1px solid var(--bdr2); color:var(--mid); border-radius:var(--r);
      transition:all 0.15s; display:flex; align-items:center; gap:7px;
    }
    .res-btn:hover { border-color:var(--gold2); color:var(--gold); }
    .res-btn.active { background:rgba(201,164,74,0.12); border-color:var(--gold); color:var(--gold); }

    .topbar {
      display:flex; align-items:center; justify-content:flex-end; gap:10px;
      padding:7px 12px; background:var(--bg2); border:1px solid var(--bdr);
      border-radius:var(--r); margin-bottom:1.25rem;
    }
    #last-update { font-size:12px; color:var(--dim); }
    .refresh-btn {
      font-family:'Cinzel',serif; font-size:11px; letter-spacing:0.08em;
      padding:4px 13px; cursor:pointer; background:transparent;
      border:1px solid var(--bdr2); color:var(--mid); border-radius:var(--r); transition:all 0.15s;
    }
    .refresh-btn:hover { border-color:var(--gold); color:var(--gold); }
    .refresh-btn:disabled { opacity:0.35; cursor:default; }

    .table-wrap { overflow-x:auto; border:1px solid var(--bdr); border-radius:var(--r); background:var(--bg2); }
    table { width:100%; border-collapse:collapse; font-size:13px; }

    thead tr { border-bottom:1px solid var(--bdr2); }
    th {
      padding:8px 10px; font-family:'Cinzel',serif; font-size:10px; font-weight:400;
      letter-spacing:0.1em; text-transform:uppercase; color:var(--dim);
      text-align:center; white-space:nowrap; background:var(--bg3);
    }
    th.l { text-align:left; }

    tbody tr { border-bottom:1px solid rgba(180,150,80,0.05); }
    tbody tr:hover td { filter:brightness(1.15); }

    tr.tier-start td { border-top:1px solid var(--bdr2); }
    tr.proc-start td { border-top:1px dashed rgba(180,150,80,0.12); }

    td { padding:5px 10px; text-align:center; vertical-align:middle; font-variant-numeric:tabular-nums; white-space:nowrap; }
    td.l { text-align:left; }

    .tc { font-family:'Cinzel',serif; font-size:11px; font-weight:600; letter-spacing:0.05em; text-align:center; vertical-align:middle; border-right:1px solid var(--bdr2); }
    .t2{color:#888780}.t3{color:#4e9e1a}.t4{color:#2277cc}.t5{color:#cc8800}.t6{color:#8855cc}.t7{color:#cc5522}.t8{color:#cc2222}

    .iname { color:var(--mid); font-size:12.5px; max-width:130px; overflow:hidden; text-overflow:ellipsis; border-right:1px solid var(--bdr); vertical-align:middle; }
    .eb { font-size:11px; font-family:'Cinzel',serif; font-weight:600; text-align:center; border-right:1px solid var(--bdr); vertical-align:middle; }
    .e0c { color:var(--dim); }
    .e1c { color:var(--e1); }
    .e2c { color:var(--e2); }
    .e3c { color:var(--e3); }

    tr.raw-row  td { background:rgba(40,40,60,0.22); }
    tr.proc-row td { background:rgba(20,30,50,0.22); }
    tr.e1 td { background:rgba(50,80,50,0.15); }
    tr.e2 td { background:rgba(40,50,80,0.15); }
    tr.e3 td { background:rgba(60,40,80,0.15); }

    .dash { color:var(--dim); }
    .pv   { color:var(--text); }
    .best { color:#6abf68; font-weight:500; }

    #loading { display:flex; align-items:center; justify-content:center; height:220px; gap:10px; color:var(--dim); font-family:'Cinzel',serif; font-size:12px; letter-spacing:0.1em; }
    .spinner { width:16px; height:16px; border:2px solid var(--bdr2); border-top-color:var(--gold); border-radius:50%; animation:spin 0.75s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    #error-box { display:none; padding:1.25rem; border:1px solid rgba(158,74,74,0.35); border-radius:var(--r); background:rgba(158,74,74,0.07); color:#c07070; font-size:13.5px; line-height:1.7; }
    #error-box code { background:rgba(0,0,0,0.3); padding:1px 6px; border-radius:3px; font-size:12px; }

    .legend { display:flex; flex-wrap:wrap; gap:16px; margin-top:1rem; font-size:12px; color:var(--dim); }
    .legend span { display:flex; align-items:center; gap:6px; }
    .ld { width:8px; height:8px; border-radius:2px; flex-shrink:0; }

    @media (max-width:640px) {
      th,td { padding:4px 6px; font-size:11.5px; }
      .iname { max-width:80px; }
    }
  </style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">Albion Online <span>Resource Prices · Europe Server · Quality 1</span></div>
    <div class="sep"></div>
  </header>

  <div class="res-tabs" id="res-tabs"></div>

  <div class="topbar">
    <span id="last-update"></span>
    <button class="refresh-btn" id="refresh-btn" onclick="loadPrices()">⟳ Refresh</button>
  </div>

  <div id="loading"><div class="spinner"></div>Fetching market prices…</div>
  <div id="error-box"></div>

  <div id="table-wrap" class="table-wrap" style="display:none;">
    <table id="main-table"></table>
  </div>

  <div class="legend">
    <span><span class="ld" style="background:#6abf68"></span>Cheapest raw / highest refined price across cities</span>
    <span><span class="ld" style="background:var(--e1)"></span>.1 enchant</span>
    <span><span class="ld" style="background:var(--e2)"></span>.2 enchant</span>
    <span><span class="ld" style="background:var(--e3)"></span>.3 enchant</span>
  </div>
</div>

<script>
const CITIES   = ['Caerleon','Bridgewatch','Fort Sterling','Lymhurst','Martlock','Thetford','Brecilien'];
const TIERS    = [2,3,4,5,6,7,8];
const ENCHANTS = [0,1,2,3];
const TIER_CLS = {2:'t2',3:'t3',4:'t4',5:'t5',6:'t6',7:'t7',8:'t8'};
const E_LABEL  = {0:'Base',1:'.1',2:'.2',3:'.3'};
const E_CLS    = {0:'e0c',1:'e1c',2:'e2c',3:'e3c'};
const E_ROW    = {0:'',1:'e1',2:'e2',3:'e3'};

const RESOURCES = [
  {
    key:'ore', label:'Ore', icon:'⚙', rk:'ORE', pk:'METALBAR',
    rn:['Copper Ore','Tin Ore','Iron Ore','Titanium Ore','Runite Ore','Meteorite Ore','Bloodstone Ore'],
    pn:['Copper Bar','Bronze Bar','Steel Bar','Titanium Steel Bar','Runite Steel Bar','Meteorite Steel Bar','Bloodsteel Bar'],
  },
  {
    key:'wood', label:'Wood', icon:'🌲', rk:'WOOD', pk:'PLANKS',
    rn:['Birch Log','Chestnut Log','Oak Log','Teak Log','Mahogany Log','Cedar Log','Bloodoak Log'],
    pn:['Birch Planks','Chestnut Planks','Oak Planks','Teak Planks','Mahogany Planks','Cedar Planks','Bloodoak Planks'],
  },
  {
    key:'fiber', label:'Fiber', icon:'🌿', rk:'FIBER', pk:'CLOTH',
    rn:['Cotton','Flax','Hemp','Skyflower','Redleaf Cotton','Sunflower','Ghostflower'],
    pn:['Simple Cloth','Neat Cloth','Fine Cloth','Opulent Cloth','Shining Cloth','Silk Cloth','Reinforced Silk'],
  },
  {
    key:'hide', label:'Hide', icon:'🛡', rk:'HIDE', pk:'LEATHER',
    rn:['Rugged Hide','Thin Hide','Medium Hide','Heavy Hide','Robust Hide','Thick Hide','Exceptional Hide'],
    pn:['Stiff Leather','Thick Leather','Worked Leather','Cured Leather','Hardened Leather','Reinforced Leather','Pristine Leather'],
  },
  {
    key:'rock', label:'Stone', icon:'🪨', rk:'ROCK', pk:'STONEBLOCK',
    rn:['Limestone','Sandstone','Travertine','Granite','Slate','Basalt','Marble'],
    pn:['Limestone Block','Sandstone Block','Travertine Block','Granite Block','Slate Block','Basalt Block','Marble Block'],
  },
];

function allIds(res) {
  const ids = [];
  TIERS.forEach(t => {
    ENCHANTS.forEach(e => {
      const s = e > 0 ? `@${e}` : '';
      ids.push(`T${t}_${res.rk}${s}`, `T${t}_${res.pk}${s}`);
    });
  });
  return ids;
}

let selectedRes = 'wood';
let priceMap = {};

function fmt(v) {
  if (!v || v === 0) return null;
  if (v >= 1e6) return (v/1e6).toFixed(2)+'M';
  if (v >= 1e3) return (v/1e3).toFixed(1)+'k';
  return Math.round(v).toLocaleString('en-US');
}

function buildResTabs() {
  const el = document.getElementById('res-tabs');
  el.innerHTML = '';
  RESOURCES.forEach(r => {
    const btn = document.createElement('button');
    btn.className = 'res-btn' + (r.key === selectedRes ? ' active' : '');
    btn.innerHTML = `<span>${r.icon}</span>${r.label}`;
    btn.onclick = () => { selectedRes = r.key; buildResTabs(); loadPrices(); };
    el.appendChild(btn);
  });
}

function renderTable() {
  const res = RESOURCES.find(r => r.key === selectedRes);
  const tbl = document.getElementById('main-table');
  tbl.innerHTML = '';

  /* Header */
  const hr = tbl.createTHead().insertRow();
  ['Tier','Item','Ench',...CITIES].forEach((h, i) => {
    const th = document.createElement('th');
    th.textContent = h;
    if (i < 3) th.className = 'l';
    hr.appendChild(th);
  });

  const tbody = tbl.createTBody();

  TIERS.forEach((t, ti) => {

    /* RAW rows */
    ENCHANTS.forEach((e, ei) => {
      const id     = `T${t}_${res.rk}` + (e > 0 ? `@${e}` : '');
      const prices = CITIES.map(c => priceMap[id]?.[c] > 0 ? priceMap[id][c] : null);
      const valid  = prices.filter(Boolean);
      const best   = valid.length ? Math.min(...valid) : null;

      const row = tbody.insertRow();
      row.className = ['raw-row', E_ROW[e], ti > 0 && ei === 0 ? 'tier-start' : ''].filter(Boolean).join(' ');

      if (ei === 0) {
        const td = document.createElement('td');
        td.className = 'tc ' + TIER_CLS[t];
        td.rowSpan = 8;
        td.textContent = 'T' + t;
        row.appendChild(td);
      }

      if (ei === 0) {
        const td = document.createElement('td');
        td.className = 'iname l';
        td.rowSpan = 4;
        td.title = res.rn[ti];
        td.textContent = res.rn[ti];
        row.appendChild(td);
      }

      const tdE = document.createElement('td');
      tdE.className = 'eb ' + E_CLS[e];
      tdE.textContent = E_LABEL[e];
      row.appendChild(tdE);

      prices.forEach(v => {
        const td = document.createElement('td');
        td.innerHTML = v == null
          ? '<span class="dash">—</span>'
          : `<span class="${v === best ? 'best' : 'pv'}">${fmt(v)}</span>`;
        row.appendChild(td);
      });
    });

    /* PROCESSED rows */
    ENCHANTS.forEach((e, ei) => {
      const id     = `T${t}_${res.pk}` + (e > 0 ? `@${e}` : '');
      const prices = CITIES.map(c => priceMap[id]?.[c] > 0 ? priceMap[id][c] : null);
      const valid  = prices.filter(Boolean);
      const best   = valid.length ? Math.max(...valid) : null;

      const row = tbody.insertRow();
      row.className = ['proc-row', E_ROW[e], ei === 0 ? 'proc-start' : ''].filter(Boolean).join(' ');

      if (ei === 0) {
        const td = document.createElement('td');
        td.className = 'iname l';
        td.rowSpan = 4;
        td.title = res.pn[ti];
        td.textContent = res.pn[ti];
        row.appendChild(td);
      }

      const tdE = document.createElement('td');
      tdE.className = 'eb ' + E_CLS[e];
      tdE.textContent = E_LABEL[e];
      row.appendChild(tdE);

      prices.forEach(v => {
        const td = document.createElement('td');
        td.innerHTML = v == null
          ? '<span class="dash">—</span>'
          : `<span class="${v === best ? 'best' : 'pv'}">${fmt(v)}</span>`;
        row.appendChild(td);
      });
    });

  });
}

async function loadPrices() {
  document.getElementById('loading').style.display = 'flex';
  document.getElementById('table-wrap').style.display = 'none';
  document.getElementById('error-box').style.display = 'none';
  const btn = document.getElementById('refresh-btn');
  btn.disabled = true;

  const res     = RESOURCES.find(r => r.key === selectedRes);
  const ids     = allIds(res);
  const urlIds  = ids.map(id => id.replace(/@(\d)/g, '%40$1')).join(',');
  const locs    = CITIES.join(',');
  const url     = `https://europe.albion-online-data.com/api/v2/stats/prices/${urlIds}.json?locations=${encodeURIComponent(locs)}&qualities=1`;

  try {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();

    priceMap = {};
    data.forEach(d => {
      if (!priceMap[d.item_id]) priceMap[d.item_id] = {};
      priceMap[d.item_id][d.city] = d.sell_price_min;
    });

    renderTable();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('table-wrap').style.display = 'block';
    document.getElementById('last-update').textContent = 'Updated: ' + new Date().toLocaleTimeString('en-GB');
  } catch(e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error-box').style.display = 'block';
    document.getElementById('error-box').innerHTML =
      `<strong>⚠ Failed to fetch prices</strong> – ${e.message}<br>
       <small>Serve via HTTP, not <code>file://</code>. Locally: <code>python -m http.server 8000</code></small>`;
  } finally {
    btn.disabled = false;
  }
}

buildResTabs();
loadPrices();
setInterval(loadPrices, 5 * 60 * 1000);
</script>
</body>
</html>
